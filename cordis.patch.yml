# 原神流浪者主题美化 · bundle patch
# 安装后由 dsh 的 profile 组合加载：Host 半部提供 /wanderer-theme/* 素材与视频路由，
# Client 半部提供主题令牌、液态玻璃样式与界面装饰。
#
# 可选配置（覆盖默认壁纸视频；不写则使用插件包内 media/wallpaper.mp4）:
#   videoPath: /path/to/your/video.mp4
- insert:
    - id: wanderer-theme
      name: dsh-theme-wanderer
      inject:
        - fs
        - webServer
